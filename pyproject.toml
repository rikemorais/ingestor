[project]
name = "ingestor"
version = "0.1.0"
description = "Data ingestion (streaming, batch, micro-batch) with a ports-and-adapters architecture"
requires-python = ">=3.14"
dependencies = [
    "confluent-kafka>=2.15.0",
]

[project.scripts]
ingestor = "ingestor.cli:main"

[project.optional-dependencies]
sse = ["httpx>=0.27"]
ws = ["websocket-client>=1.8"]

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-glightbox>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestor"]
