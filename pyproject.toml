[project]
name = "data-ingestor"
dynamic = ["version"]
description = "Data ingestion (streaming, batch, micro-batch) with a ports-and-adapters architecture"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "confluent-kafka>=2.15.0",
]

[project.scripts]
ingestor = "ingestor.cli:main"

[project.optional-dependencies]
sse = ["httpx>=0.27"]
ws = ["websocket-client>=1.8"]

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-glightbox>=0.4",
]
test = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "websocket-client>=1.8",
]
dev = [
    "ruff>=0.8",
    "mypy>=1.11",
    "interrogate>=1.7",
    "pre-commit>=3.8",
    "httpx>=0.27",
    "websocket-client>=1.8",
]

[tool.ruff]
line-length = 100
# Pinned below requires-python so the formatter keeps portable, explicit syntax
# (e.g. parenthesized exception tuples), which 3.14's grammar would let it drop.
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"] # tests do not require docstrings

[tool.interrogate]
fail-under = 100
exclude = ["tests", "docs"]
ignore-init-module = false
verbose = 1

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ingestor --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = false
source = ["ingestor"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "\\.\\.\\.",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# PyPI rejects local version labels (the "+g<hash>" suffix), so drop them; dev
# builds become e.g. 0.1.1.dev5, which TestPyPI and PyPI accept.
[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestor"]
