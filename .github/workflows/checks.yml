name: Checks

on:
  push:
    branches: [main, develop, "v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.14
      - name: Ruff lint
        run: uv run --group dev ruff check .
      - name: Ruff format
        run: uv run --group dev ruff format --check .

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.14
      - name: Mypy
        run: uv run --group dev --extra sse --extra ws mypy src/ingestor

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.14
      - name: Lock is in sync
        run: uv lock --check
      - name: Build sdist and wheel
        run: uv build

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.14
      - name: MkDocs strict build
        run: uv run --group docs mkdocs build --strict
