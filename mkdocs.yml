site_name: Ingestor
site_description: Data ingestion (streaming, batch, micro-batch) with a ports-and-adapters architecture
site_url: https://rikemorais.github.io/ingestor/
repo_url: https://github.com/rikemorais/ingestor
repo_name: rikemorais/ingestor
edit_uri: tree/main/docs
copyright: Ingestor

theme:
  name: material
  language: en
  icon:
    logo: material/database-import
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: pink
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - search.highlight
    - search.share
    - search.suggest

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Adapters: adapters.md
  - Examples: examples.md
  - Live streams: streaming.md
  - API reference: reference.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - toc:
      permalink: true

plugins:
  - search
  - glightbox
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

extra_css:
  - stylesheets/extra.css
